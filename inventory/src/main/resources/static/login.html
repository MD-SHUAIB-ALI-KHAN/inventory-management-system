<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Inventory</title><link rel="stylesheet" href="style.css"></head>
<body class="loginPage">
  <form class="card login" method="post" action="/login">
    <h2>📦 Inventory Login</h2>
    <p id="msg"></p>
    <input name="username" placeholder="Username" required autofocus>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
<script>
  const q = new URLSearchParams(location.search), m = document.getElementById('msg');
  if (q.has('error')) { m.textContent = 'Invalid username or password'; m.className = 'err'; }
  if (q.has('logout')) { m.textContent = 'You have been logged out'; m.className = 'ok'; }
</script></body></html>
