<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Management</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>📦 Inventory Management System</h1><a href="/logout" class="logout">Logout</a></header>
<main>
  <section class="card"><h2 id="formTitle">Add Item</h2>
    <form id="itemForm">
      <input type="hidden" id="id">
      <input id="name" placeholder="Item name (e.g. Dolo 650)" required>
      <input id="category" placeholder="Category">
      <input id="batchNo" placeholder="Batch No">
      <input id="quantity" type="number" min="0" placeholder="Quantity" required>
      <input id="price" type="number" step="0.01" min="0" placeholder="Price (₹)" required>
      <input id="supplier" placeholder="Supplier">
      <label>Purchase Date<input id="purchaseDate" type="date"></label>
      <label>Expiry Date<input id="expiryDate" type="date"></label>
      <div class="btns"><button type="submit">Save</button><button type="button" id="cancel" class="grey">Clear</button></div>
    </form>
  </section>
  <section class="card"><div class="top"><h2>Stock</h2><input id="search" placeholder="🔍 Search name, category, supplier"></div>
    <div class="stats" id="stats"></div>
    <div class="scroll"><table><thead><tr><th>#</th><th>Name</th><th>Category</th><th>Batch</th><th>Qty</th><th>Price</th><th>Supplier</th><th>Purchased</th><th>Expiry</th><th>Actions</th></tr></thead>
    <tbody id="rows"></tbody></table></div>
  </section>
</main>
<script src="app.js"></script></body></html>
